<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Offline - Smart Klontong</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                margin: 0;
                padding: 0;
                display: flex;
                min-height: 100vh;
                align-items: center;
                justify-content: center;
                background: #f3f4f6;
                color: #111827;
            }
            .card {
                max-width: 420px;
                width: 100%;
                padding: 2rem;
                border-radius: 1rem;
                box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
                background: #ffffff;
                text-align: center;
            }
            h1 {
                margin: 0 0 1rem;
                font-size: 1.75rem;
                color: #1a7175;
            }
            p {
                margin: 0 0 1rem;
                line-height: 1.75;
            }
            a {
                display: inline-block;
                margin-top: 1rem;
                color: #fff;
                background: #1a7175;
                padding: 0.75rem 1.25rem;
                border-radius: 0.75rem;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>Anda Offline</h1>
            <p>
                Smart Klontong tetap tersedia meskipun koneksi internet
                terputus. Silakan coba lagi setelah kembali online.
            </p>
            <a href="/">Kembali ke Beranda</a>
        </div>
    </body>
</html>
